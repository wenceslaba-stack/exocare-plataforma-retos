</head>
<body>
<style>
/* la X de EXOCARE al entrar: estilos dentro de la página para que nunca salga sin forma */
.intro{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.intro svg{display:block;width:120px;height:120px;overflow:visible}
.intro path{fill:none;stroke:#275d80;stroke-width:68;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.intro circle{fill:#0f94ce;opacity:0;transform-box:fill-box;transform-origin:center;transform:translateY(-140px) scale(.4)}
.intro.intro-play{animation:exoIntroOut .6s cubic-bezier(.16,1,.3,1) 1.35s forwards}
.intro.intro-play path{animation:exoDraw .55s cubic-bezier(.65,0,.35,1) forwards}
.intro.intro-play .i2{animation-delay:.42s;animation-duration:.35s}
.intro.intro-play circle{animation:exoDrop .6s cubic-bezier(.34,1.56,.64,1) .72s forwards}
@keyframes exoDraw{to{stroke-dashoffset:0}}
@keyframes exoDrop{to{transform:none;opacity:1}}
@keyframes exoIntroOut{to{opacity:0;visibility:hidden;transform:scale(1.04)}}
.intro-wait .hero .w,.intro-wait .hero .kicker,.intro-wait .hero .lead,.intro-wait .hero .cta{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.intro{display:none}}
</style>
<div class="intro" id="intro" aria-hidden="true">
  <svg viewBox="0 0 223 223" width="120" height="120"><path class="i1" pathLength="1" d="M34 34 L189 189" fill="none" stroke="#275d80" stroke-width="68" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"/><path class="i2" pathLength="1" d="M34 189 L95 128" fill="none" stroke="#275d80" stroke-width="68" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"/><circle class="i3" cx="189" cy="34" r="34" fill="#0f94ce" opacity="0"/></svg>
</div>
<script>
(function(){
  var i=document.getElementById('intro'), root=document.documentElement, started=false;
  try{ if(sessionStorage.getItem('exo-intro') || matchMedia('(prefers-reduced-motion: reduce)').matches){ i.remove(); return; } }catch(e){}
  root.classList.add('intro-wait');
  function go(){ if(started) return; started=true; try{ sessionStorage.setItem('exo-intro','1'); }catch(e){} i.classList.add('intro-play'); root.classList.remove('intro-wait'); setTimeout(function(){ i.remove(); },2300); }
  var inView=!('IntersectionObserver' in window), frames=0;
  if(!inView){ new IntersectionObserver(function(es){ inView=es[0].isIntersecting; },{threshold:.5}).observe(i); }
  function tick(){
    if(started) return;
    if(document.visibilityState==='visible' && inView){ if(++frames>8) return go(); } else frames=0;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(function(){ if(!started){ i.remove(); root.classList.remove('intro-wait'); } },10000);
})();
</script>
<div class="progress" id="progress" aria-hidden="true"></div>

      <button type="button" data-lang="es" aria-pressed="true">ES</button>
      <button type="button" data-lang="pt" aria-pressed="false">PT</button>
    </div>
  </div>
